name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Розпакування твого архіву
    - name: Unzip GrandAdminTools_v2
      run: |
        if [ -f "GrandAdminTools_v2.zip" ]; then
          unzip -o "GrandAdminTools_v2.zip" -d .
        else
          echo "Zip file not found!"
        fi

    # Створюємо правильну структуру папок для Android проєкту
    - name: Restructure Project for Android Build
      run: |
        mkdir -p android-project/app/src/main/java
        mkdir -p android-project/app/src/main/res/xml
        
        # Переносимо твої файли у правильні папки коду та ресурсів
        [ -d "app" ] && cp -r app/* android-project/app/src/main/java/ || echo "No app dir"
        [ -d "res" ] && cp -r res/* android-project/app/src/main/res/ || echo "No res dir"

        # Створюємо технічний xml-файл методу введення
        cat << 'EOF' > android-project/app/src/main/res/xml/method.xml
        <?xml version="1.0" encoding="utf-8"?>
        <input-method xmlns:android="http://android.com"
            android:settingsActivity="app.admin.keyboard.MainActivity" />
        EOF

        # ВИДАЛЯЄМО НЕВИДИМИЙ СИМВОЛ BOM (\ufeff)
        find android-project/app/src/main/java -type f -name "*.java" -exec sed -i '1s/^\xef\xbb\xbf//' {} +

        # АВТОМАТИЧНО ДОДАЄМО ІМПОРТ КЛАСУ R У ВСІ JAVA ФАЙЛИ
        find android-project/app/src/main/java -type f -name "*.java" -exec sed -i '2i import app.admin.keyboard.R;' {} +

        # ГЕНЕРУЄМО ПОВНОЦІННИЙ МАНІФЕСТ З УСІМА СИСТЕМНИМИ ПРЕФІКСАМИ ANDROID
        cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            
            <uses-permission android:name="android.permission.INTERNET" />

            <application
                android:label="LiksonTOOLS v2"
                android:supportsRtl="true">
                
                <service
                    android:name="app.admin.keyboard.AdminKeyboardService"
                    android:label="LiksonTOOLS v2"
                    android:permission="android.permission.BIND_INPUT_METHOD"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.view.InputMethod" />
                    </intent-filter>
                    <meta-data
                        android:name="android.view.im"
                        android:resource="@xml/method" />
                </service>
                
            </application>
        </manifest>
        EOF

        # Створюємо чистий та правильний build.gradle для проєкту
        cat << 'EOF' > android-project/build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # Створюємо чистий build.gradle для самого додатку
        cat << 'EOF' > android-project/app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'app.admin.keyboard'
            compileSdk 34
            defaultConfig {
                applicationId "app.admin.keyboard"
                minSdk 24
                targetSdk 34
                versionCode 2
                versionName "2.0"
            }
        }
        EOF

        # Коригуємо settings.gradle
        echo "include ':app'" > android-project/settings.gradle

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Встановлюємо Gradle 8.10
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'

    # Запускаємо збірку
    - name: Build with Gradle
      run: |
        cd android-project
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiksonTOOLS-v2-DebugAPK
        path: |
          android-project/app/build/outputs/apk/debug/*.apk
          **/*.apk
