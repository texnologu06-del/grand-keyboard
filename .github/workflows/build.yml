name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Розпакування твого архіву перед збіркою
    - name: Unzip GrandAdminTools
      run: |
     unzip -o "GrandAdminTools_v2.zip" -d .

          unzip -o "GrandAdminTools (2).zip" -d .
        elif [ -f "GrandAdminTools(2).zip" ]; then
          unzip -o "GrandAdminTools(2).zip" -d .
        else
          echo "Zip file not found!"
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Change wrapper permissions
      run: chmod +x gradlew
      continue-on-error: true

    - name: Build with Gradle
      run: |
        if [ -f ./gradlew ]; then
          ./gradlew assembleDebug
        else
          sudo apt-get update && sudo apt-get install -y gradle
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiksonTOOLS-v2-DebugAPK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/*.apk
