name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Розпакування твого нового архіву
    - name: Unzip GrandAdminTools_v2
      run: |
        if [ -f "GrandAdminTools_v2.zip" ]; then
          unzip -o "GrandAdminTools_v2.zip" -d .
        else
          echo "Zip file not found!"
        fi

    # Видаляємо застарілий атрибут package з AndroidManifest.xml, щоб Gradle не ругався
    - name: Fix AndroidManifest package attribute
      run: |
        if [ -f "AndroidManifest.xml" ]; then
          sed -i 's/package="[^"]*"//g' AndroidManifest.xml
          echo "AndroidManifest.xml fixed!"
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Встановлюємо правильну версію Gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiksonTOOLS-v2-DebugAPK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/*.apk
